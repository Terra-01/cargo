name: Bug report
description: Something in a tool does not work as it should
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Hub / site-wide
        - Shader Gradient Lab
        - Text Animation Library
        - Moodboard Library
        - Loading States Gallery
        - The Spec Pressure-Test
        - UI Pattern Library
        - The Type Field Guide
        - Mockup Wrapper
        - Easing Cookbook
        - CSS Effect Lab
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /tools/...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 141 on macOS 15
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything in the browser console. Optional, but very helpful.
      render: text
